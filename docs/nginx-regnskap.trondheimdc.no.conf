# regnskap.trondheimdc.no — static SPA + same-origin proxy to the Fiken API.
#
# api.fiken.no has no CORS, so the browser can't call it directly. /api/fiken/* is forwarded
# as-is; the browser's own Fiken access token (OAuth, Authorization header) does the auth.
# The proxy holds no credentials and is useless without a valid Fiken token.

server {
    listen 80;
    listen [::]:80;
    server_name regnskap.trondheimdc.no;

    access_log /var/www/sites/regnskap.trondheimdc.no/logs/access.log combined;
    error_log  /var/www/sites/regnskap.trondheimdc.no/logs/error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name regnskap.trondheimdc.no;

    access_log /var/www/sites/regnskap.trondheimdc.no/logs/access.log combined;
    error_log  /var/www/sites/regnskap.trondheimdc.no/logs/error.log;

    root /var/www/sites/regnskap.trondheimdc.no/public;

    # Added by certbot; keep them when copying this file over.
    ssl_certificate     /etc/letsencrypt/live/regnskap.trondheimdc.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/regnskap.trondheimdc.no/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Note: add_header in a location replaces any from the server level, so each location sets its own.

    location /api/fiken/ {
        proxy_pass https://api.fiken.no/api/v2/;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        # The default depth (1) is too short for Let's Encrypt's chain
        # (fiken.no → YE1 → Root YE → ISRG Root X2) and every request ends in 502.
        proxy_ssl_verify_depth 4;
        proxy_set_header Host api.fiken.no;

        # Same-origin requests still carry these; Fiken doesn't need them.
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;

        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        client_max_body_size 25m;

        # Never cache API responses: "Oppdater" must read Fiken, whatever Fiken sends. Ours
        # replaces Fiken's header instead of adding a second one.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Hashed file names: a new deploy gets new names, so these can be cached forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Tokens live in the page; keep it locked down. Next inlines its bootstrap scripts.
    location / {
        index index.html;
        # Always check for a new deploy, so the page never points at old /_next/static files.
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://fiken.no; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # SPA fallback: paths like /bilag/<id> have no file; the app reads them from the URL and
        # shows its own 404 for paths it doesn't know.
        try_files $uri $uri.html $uri/ /index.html;
    }

    error_page 404 /404.html;
}
